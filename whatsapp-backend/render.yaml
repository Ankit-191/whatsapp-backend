services:
  - type: web
    name: radial-code-whatsapp-backend
    runtime: docker
    dockerfilePath: Dockerfile
    dockerContext: .
    plan: starter
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-db
          property: connectionString
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_PHONE_NUMBER_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_VERIFY_TOKEN
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v21.0
      - key: FRONTEND_ORIGIN
        sync: false

databases:
  - name: whatsapp-db
    databaseName: whatsapp_support
    user: postgres
    plan: starter

